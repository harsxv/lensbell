<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Lensbell app icon. Follows the macOS icon grid:
       824x824 rounded square centred on a 1024 canvas. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16263D"/>
      <stop offset="1" stop-color="#0B1524"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="297" fill="#1E3350"/>
  <circle cx="512" cy="512" r="231" fill="#0A1220"/>
  <circle cx="512" cy="512" r="159" fill="#1B6FB8"/>
  <circle cx="512" cy="512" r="88" fill="#0A1220"/>
  <circle cx="452" cy="452" r="33" fill="#9FD3FF"/>
  <circle cx="776" cy="248" r="82" fill="#FF3B30" stroke="#122036" stroke-width="27"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
